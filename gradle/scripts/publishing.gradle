apply from: 'gradle/scripts/helpers.gradle'

setDefaultProperty('publish_to_curseforge', true, false)
setDefaultProperty('publish_to_modrinth', true, false)

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = propertyString('mod_id')
        }
    }
}

if (propertyBool('publish_to_curseforge')) {
    assertProperty('curseforge_project_id')
}
if (propertyBool('publish_to_modrinth')) {
    assertProperty('modrinth_project_id')
}

conventions {
    mods {
        if (propertyBool('publish_to_curseforge')) {
            curseforge {
                projectId = propertyString('curseforge_project_id')
                clientRequired = true
                serverRequired = true
            }
        }
        if (propertyBool('publish_to_modrinth')) {
            modrinth = propertyString('modrinth_project_id')
        }
    }
}

publishMods {
    file = tasks.reobfJar.archiveFile
    displayName = "${propertyString('mod_name')} ${project.version}"
    changelog = provider { releaseNotes() }
}

String releaseNotes() {
    String runnerTemp = System.getenv('RUNNER_TEMP')
    if (runnerTemp != null && !runnerTemp.isEmpty()) {
        def notes = file("${runnerTemp}/RELEASE_NOTES.md")
        if (notes.exists()) {
            return notes.text.trim()
        }
    }
    return changelogSection(version.toString())
}

// Version headings are '## <version> - <date>', optionally bracketed, while the group headings nested under them are '## <name>'
String changelogSection(String target) {
    def changelog = file('CHANGELOG.md')
    if (!changelog.exists()) {
        return ''
    }
    String section = changelog.text.split(/(?m)^## \[?(?=\d)/).find { it.startsWith(target) && !it.substring(target.length()).take(1).matches(/[\w.-]/) }
    return section == null ? '' : section.substring(section.indexOf('\n') + 1).trim()
}
